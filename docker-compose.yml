services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://16.176.131.85:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
